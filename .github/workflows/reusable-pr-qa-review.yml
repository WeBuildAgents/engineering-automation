name: Reusable PR QA Review

on:
  workflow_call:
    inputs:
      slack_enabled:
        required: false
        type: boolean
        default: true
      slack_title:
        required: false
        type: string
        default: "PR QA Review"
      max_diff_chars:
        required: false
        type: number
        default: 120000
      fail_on_block:
        required: false
        type: boolean
        default: true
    secrets:
      CURSOR_API_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target-repo

      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: WeBuildAgents/engineering-automation
          ref: main
          path: automation

      - name: Generate PR context
        working-directory: target-repo
        run: |
          mkdir -p tmp

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" --depth=50

          git diff "origin/${BASE_REF}...${HEAD_SHA}" > tmp/pr.diff
          git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}" > tmp/changed-files.txt

      - name: Trim diff if needed
        run: |
          python - <<'PY'
          from pathlib import Path

          max_chars = int("${{ inputs.max_diff_chars }}")
          diff_path = Path("target-repo/tmp/pr.diff")
          content = diff_path.read_text(encoding="utf-8", errors="ignore")

          if len(content) > max_chars:
              content = content[:max_chars] + "\n\n[DIFF TRUNCATED]"

          diff_path.write_text(content, encoding="utf-8")
          PY

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          import textwrap

          prompt = Path("automation/cursor/prompts/pr-review.md").read_text(encoding="utf-8")
          files = Path("target-repo/tmp/changed-files.txt").read_text(encoding="utf-8", errors="ignore")
          diff_ = Path("target-repo/tmp/pr.diff").read_text(encoding="utf-8", errors="ignore")

          full_prompt = f"""{prompt}

          Repository: ${{ github.repository }}
          Pull Request: #${{ github.event.pull_request.number }}

          Changed files:
          {files}

          Diff:
          {diff_}
          """

          result = subprocess.run(
              ["cursor-agent", "--trust", "-p", full_prompt],
              capture_output=True,
              text=True
          )

          stdout = (result.stdout or "").strip()
          stderr = (result.stderr or "").strip()
          output = stdout if stdout else stderr

          if not output:
              output = textwrap.dedent("""
                  ## Summary
                  - Change classification: UNKNOWN
                  - Scope: Unable to determine because the automated review returned no output.
                  - Validation posture: weak
                  - Execution gate: UNKNOWN
                  - Full-scope coverage gate: UNKNOWN
                  - Coverage phase: N/A

                  ## Code Quality Report

                  | Finding | Severity | Description | Recommendation |
                  |---------|----------|-------------|----------------|
                  | Empty review output | BLOCKER | Cursor returned no review output. | Re-run the review and validate the CI integration before accepting this PR. |

                  - Score (0–10): 0
                  - Gate result: Automated review failed.

                  ## Missing Tests
                  - Unable to determine because review output was empty.

                  ## Coverage Risk
                  Unknown. Automated review returned no usable output.

                  ## Recommendations
                  1. Re-run the automated review.
                  2. Inspect Cursor CLI execution in CI.
                  3. Do not approve the PR until a valid review is produced.

                  ## Recommendation
                  BLOCK
              """).strip()

          lower = output.lower()
          if output.lstrip().startswith("<html") or "<head>" in lower or "<body" in lower:
              output = textwrap.dedent("""
                  ## Summary
                  - Change classification: UNKNOWN
                  - Scope: Automated review returned HTML instead of a QA review.
                  - Validation posture: weak
                  - Execution gate: UNKNOWN
                  - Full-scope coverage gate: UNKNOWN
                  - Coverage phase: N/A

                  ## Code Quality Report

                  | Finding | Severity | Description | Recommendation |
                  |---------|----------|-------------|----------------|
                  | Invalid output format | BLOCKER | The review returned raw HTML instead of the required markdown review. | Fix the prompt or output handling and rerun the review before accepting this PR. |

                  - Score (0–10): 0
                  - Gate result: Automated review output is invalid.

                  ## Missing Tests
                  - Unable to determine because the review output was invalid.

                  ## Coverage Risk
                  Unknown. Review output failed validation.

                  ## Recommendations
                  1. Fix the reviewer output format.
                  2. Enforce markdown-only output in the prompt.
                  3. Re-run the review before proceeding.

                  ## Recommendation
                  BLOCK
              """).strip()

          required = [
              "## Summary",
              "## Code Quality Report",
              "## Missing Tests",
              "## Coverage Risk",
              "## Recommendations",
              "## Recommendation",
          ]

          if not all(section in output for section in required):
              output = textwrap.dedent(f"""
                  ## Summary
                  - Change classification: UNKNOWN
                  - Scope: Automated review completed, but the output format was invalid.
                  - Validation posture: weak
                  - Execution gate: UNKNOWN
                  - Full-scope coverage gate: UNKNOWN
                  - Coverage phase: N/A

                  ## Code Quality Report

                  | Finding | Severity | Description | Recommendation |
                  |---------|----------|-------------|----------------|
                  | Invalid review structure | BLOCKER | The review did not include all required sections. | Fix the prompt/output contract and rerun the review before accepting this PR. |

                  - Score (0–10): 0
                  - Gate result: Automated review output is malformed.

                  ## Missing Tests
                  - Unable to reliably determine because the review structure was invalid.

                  ## Coverage Risk
                  Unknown. Output did not satisfy the required review format.

                  ## Recommendations
                  1. Fix the prompt so all required sections are always returned.
                  2. Re-run the review.
                  3. Do not approve the PR based on malformed output.

                  ## Recommendation
                  BLOCK

                  Original output:

                  {output}
              """).strip()

          match = re.search(
              r"## Recommendation\s*\n\s*(APPROVE|NEEDS TESTS|BLOCK)\b",
              output,
              re.IGNORECASE
          )
          recommendation = match.group(1).upper() if match else "BLOCK"

          Path("qa-review.md").write_text(output, encoding="utf-8")
          Path("qa-review-result.txt").write_text(recommendation, encoding="utf-8")
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-review
          path: |
            qa-review.md
            qa-review-result.txt

      - name: Comment review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('qa-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Send summary to Slack
        if: ${{ inputs.slack_enabled }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          webhook_url = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook_url:
              print("SLACK_WEBHOOK_URL is not configured. Skipping Slack notification.")
              exit(0)

          review = Path("qa-review.md").read_text(encoding="utf-8")
          recommendation = Path("qa-review-result.txt").read_text(encoding="utf-8").strip()

          payload = {
              "text": (
                  f"*${{ inputs.slack_title }}*\n"
                  f"Repository: ${{ github.repository }}\n"
                  f"PR: #${{ github.event.pull_request.number }}\n"
                  f"Final recommendation: {recommendation}\n\n"
                  f"{review[:3200]}"
              )
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY

      - name: Fail workflow on BLOCK
        if: ${{ inputs.fail_on_block }}
        run: |
          RESULT="$(cat qa-review-result.txt)"
          if [ "$RESULT" = "BLOCK" ]; then
            echo "Final recommendation is BLOCK. Failing workflow."
            exit 1
          fi
