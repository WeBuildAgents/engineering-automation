name: Reusable PR QA Review

on:
  workflow_call:
    inputs:
      slack_enabled:
        required: false
        type: boolean
        default: true
      slack_title:
        required: false
        type: string
        default: "PR QA Review"
      max_diff_chars:
        required: false
        type: number
        default: 120000
    secrets:
      CURSOR_API_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target-repo

      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: veronicanegreiro-wba/engineering-automation
          ref: main
          path: automation

      - name: Generate PR context
        working-directory: target-repo
        run: |
          mkdir -p tmp
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > tmp/pr.diff
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > tmp/changed-files.txt

      - name: Trim diff if needed
        run: |
          python - <<'PY'
          from pathlib import Path

          max_chars = int("${{ inputs.max_diff_chars }}")
          diff_path = Path("target-repo/tmp/pr.diff")
          content = diff_path.read_text(encoding="utf-8", errors="ignore")
          if len(content) > max_chars:
              content = content[:max_chars] + "\n\n[DIFF TRUNCATED]"
          diff_path.write_text(content, encoding="utf-8")
          PY

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run Cursor review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          prompt = Path("automation/cursor/prompts/pr-review.md").read_text(encoding="utf-8")
          files = Path("target-repo/tmp/changed-files.txt").read_text(encoding="utf-8", errors="ignore")
          diff_ = Path("target-repo/tmp/pr.diff").read_text(encoding="utf-8", errors="ignore")

          full_prompt = f"""{prompt}

          Repository: ${{ github.repository }}
          Pull Request: #${{ github.event.pull_request.number }}

          Changed files:
          {files}

          Diff:
          {diff_}
          """

          result = subprocess.run(
              ["cursor-agent", "-p", full_prompt],
              capture_output=True,
              text=True,
              check=True,
          )

          output = result.stdout.strip()

          # Basic hardening against raw HTML/tool leakage
          if output.lstrip().startswith("<html") or "<head>" in output or "<body" in output:
              output = """## Summary
The automated review returned invalid HTML output instead of a QA review.

## Risks
- Review output is unusable
- PR was not reviewed in the expected QA format

## Missing Tests
- Unable to determine because review output was invalid

## Coverage Risk
Unknown. Automated review output failed validation.

## Recommendation
BLOCK"""

          required = [
              "## Summary",
              "## Risks",
              "## Missing Tests",
              "## Coverage Risk",
              "## Recommendation",
          ]

          if not all(section in output for section in required):
              output = f"""## Summary
Automated review completed, but the output format was invalid.

## Risks
- Output did not match the required QA review structure
- Review quality cannot be trusted without the required sections

## Missing Tests
- Unable to reliably determine from malformed output

## Coverage Risk
Unknown due to invalid review format.

## Recommendation
BLOCK

Original output:

{output}
"""

          Path("qa-review.md").write_text(output, encoding="utf-8")
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-review
          path: qa-review.md

      - name: Comment review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('qa-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Send summary to Slack
        if: ${{ inputs.slack_enabled && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          review = Path("qa-review.md").read_text(encoding="utf-8")

          payload = {
              "text": (
                  f"*${{ inputs.slack_title }}*\n"
                  f"Repository: ${{ github.repository }}\n"
                  f"PR: #${{ github.event.pull_request.number }}\n\n"
                  f"{review[:3500]}"
              )
          }

          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY
