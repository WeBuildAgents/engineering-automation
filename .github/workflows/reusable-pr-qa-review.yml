name: Reusable PR QA Review

on:
  workflow_call:
    inputs:
      slack_enabled:
        required: false
        type: boolean
        default: true
      slack_title:
        required: false
        type: string
        default: "PR QA Review"
      max_diff_chars:
        required: false
        type: number
        default: 120000
      fail_on_block:
        required: false
        type: boolean
        default: true
    secrets:
      CURSOR_API_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qa-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target-repo

      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: WeBuildAgents/engineering-automation
          ref: main
          path: automation

      - name: Generate PR context
        working-directory: target-repo
        run: |
          mkdir -p tmp

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" --depth=50

          git diff "origin/${BASE_REF}...${HEAD_SHA}" > tmp/pr.diff
          git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}" > tmp/changed-files.txt

      - name: Trim diff if needed
        run: |
          python - <<'PY'
          from pathlib import Path

          max_chars = int("${{ inputs.max_diff_chars }}")
          diff_path = Path("target-repo/tmp/pr.diff")
          content = diff_path.read_text(encoding="utf-8", errors="ignore")

          if len(content) > max_chars:
              content = content[:max_chars] + "\n\n[DIFF TRUNCATED]"

          diff_path.write_text(content, encoding="utf-8")
          PY

      - name: Fetch prior review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            // Find the last bot comment that looks like a QA review.
            const reviewComments = comments.filter(c =>
              c.body && c.body.includes('## Summary') && c.body.includes('## Recommendation')
            );

            const prior = reviewComments.length > 0
              ? reviewComments[reviewComments.length - 1].body
              : '';

            fs.mkdirSync('target-repo/tmp', { recursive: true });
            fs.writeFileSync('target-repo/tmp/prior-review.md', prior, 'utf8');
            console.log(prior ? `Prior review found (${prior.length} chars).` : 'No prior review found.');

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          import textwrap

          def write_debug_file(path: str, value: str) -> None:
              Path(path).write_text(value or "", encoding="utf-8")

          def required_heading_missing(output: str, required_headings: list[str]) -> list[str]:
              """Validate markdown headings as exact heading lines, not substrings.

              This avoids treating `## Recommendations` as if it satisfied
              the final singular `## Recommendation` section.
              """
              missing = []
              for heading in required_headings:
                  pattern = rf"(?m)^\s*{re.escape(heading)}\s*$"
                  if not re.search(pattern, output):
                      missing.append(heading)
              return missing

          def fallback_review(reason: str, finding: str, description: str, recommendation: str, original_output: str = "") -> str:
              original_section = ""
              if original_output.strip():
                  original_section = f"\n\nOriginal output:\n\n{original_output.strip()}"

              return textwrap.dedent(f"""
                  ## Summary
                  - Change classification: UNKNOWN
                  - Tier: UNKNOWN — automated review output could not be validated.
                  - Scope: {reason}
                  - Validation posture: weak
                  - Execution gate: UNKNOWN
                  - Full-scope coverage gate: UNKNOWN
                  - Coverage phase: N/A

                  ## Code Quality Report

                  | Finding | Severity | Description | Recommendation |
                  |---------|----------|-------------|----------------|
                  | {finding} | BLOCKER | {description} | {recommendation} |

                  - Score (0–10): 0
                  - Gate result: Automated review output is invalid.

                  ## Missing Tests
                  - Unable to reliably determine because the automated review output was invalid.

                  ## Coverage Risk
                  Unknown. The review output did not satisfy the required format contract, so the validation posture cannot be trusted.

                  ## Recommendations
                  1. Inspect the uploaded artifacts: `qa-review-raw-output.md`, `qa-review-stderr.txt`, and `qa-review-missing-sections.txt`.
                  2. Fix the prompt/output contract or Cursor execution issue that produced the invalid output.
                  3. Re-run the PR QA review before accepting this PR.

                  ## Recommendation
                  BLOCK{original_section}
              """).strip()

          # Resolve absolute paths so cursor-agent finds them regardless of cwd.
          prompt_path = Path("automation/cursor/prompts/pr-review.md").resolve()
          files_path = Path("target-repo/tmp/changed-files.txt").resolve()
          diff_path = Path("target-repo/tmp/pr.diff").resolve()
          prior_review_path = Path("target-repo/tmp/prior-review.md").resolve()

          prior_review_text = prior_review_path.read_text(encoding="utf-8", errors="ignore").strip()

          prior_section = ""
          if prior_review_text:
              prior_section = textwrap.dedent(f"""
                  Step 4. Read the prior automated review for this PR:
                      {prior_review_path}

                  This is a re-review. Apply §10 of the review governance (Review iteration and closure rules):
                  - Assess each finding from the prior review as resolved / partially resolved / unresolved.
                  - Do not re-raise resolved findings as new findings.
                  - Only flag genuinely new issues introduced since the prior review.
              """).strip()

          driver_prompt = textwrap.dedent(f"""
              You are running an automated PR QA review.

              Use file-reading tools to read the following files from disk, in order:

              Step 1. Read the full review instructions and follow them strictly:
                  {prompt_path}

              Step 2. Read the list of changed files in this PR:
                  {files_path}

              Step 3. Read the unified diff for this PR:
                  {diff_path}

              {prior_section}

              Repository: ${{ github.repository }}
              Pull Request: #${{ github.event.pull_request.number }}

              Output ONLY the markdown review described by the instructions in step 1.
              Do not include any preamble, raw HTML, JSON, or code fences wrapping the entire response.
              The final section must be exactly:

              ## Recommendation
              APPROVE / NEEDS TESTS / BLOCK
          """).strip()

          result = subprocess.run(
              ["cursor-agent", "--trust", "-p", driver_prompt],
              capture_output=True,
              text=True,
          )

          stdout = (result.stdout or "").strip()
          stderr = (result.stderr or "").strip()

          write_debug_file("qa-review-raw-output.md", stdout)
          write_debug_file("qa-review-stderr.txt", stderr)
          write_debug_file("qa-review-return-code.txt", str(result.returncode))

          print(f"Cursor exit code: {result.returncode}")
          print(f"Cursor stdout chars: {len(stdout)}")
          print(f"Cursor stderr chars: {len(stderr)}")

          output = stdout

          if result.returncode != 0 and not output:
              output = fallback_review(
                  reason="Cursor CLI exited with a non-zero status and produced no markdown review.",
                  finding="Cursor execution failed",
                  description="Cursor CLI did not produce a valid PR QA review.",
                  recommendation="Inspect qa-review-stderr.txt and fix Cursor/API execution before accepting this PR.",
                  original_output=stderr,
              )
          elif not output:
              output = fallback_review(
                  reason="Cursor CLI completed but returned no markdown review output.",
                  finding="Empty review output",
                  description="Cursor returned no review output.",
                  recommendation="Re-run the review and validate the CI integration before accepting this PR.",
              )

          lower = output.lower()
          if output.lstrip().startswith("<html") or "<head>" in lower or "<body" in lower:
              output = fallback_review(
                  reason="Automated review returned HTML instead of a QA review.",
                  finding="Invalid output format",
                  description="The review returned raw HTML instead of the required markdown review.",
                  recommendation="Fix the prompt or output handling and rerun the review before accepting this PR.",
                  original_output=output,
              )

          required = [
              "## Summary",
              "## Code Quality Report",
              "## Missing Tests",
              "## Coverage Risk",
              "## Recommendations",
              "## Recommendation",
          ]

          missing = required_heading_missing(output, required)
          write_debug_file(
              "qa-review-missing-sections.txt",
              "NONE" if not missing else "\n".join(missing),
          )

          if missing:
              print("Invalid review structure. Missing sections:")
              for section in missing:
                  print(f"- {section}")

              output = fallback_review(
                  reason="Automated review completed, but the output format was invalid.",
                  finding="Invalid review structure",
                  description=f"The review did not include all required sections. Missing: {', '.join(missing)}.",
                  recommendation="Fix the prompt/output contract and rerun the review before accepting this PR.",
                  original_output=output,
              )

          match = re.search(
              r"(?m)^\s*## Recommendation\s*\n\s*(APPROVE|NEEDS TESTS|BLOCK)\b",
              output,
              re.IGNORECASE,
          )
          recommendation = match.group(1).upper() if match else "BLOCK"

          Path("qa-review.md").write_text(output, encoding="utf-8")
          Path("qa-review-result.txt").write_text(recommendation, encoding="utf-8")
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-review
          path: |
            qa-review.md
            qa-review-result.txt
            qa-review-raw-output.md
            qa-review-stderr.txt
            qa-review-return-code.txt
            qa-review-missing-sections.txt

      - name: Comment review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('qa-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Send summary to Slack
        if: ${{ inputs.slack_enabled }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          webhook_url = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook_url:
              print("SLACK_WEBHOOK_URL is not configured. Skipping Slack notification.")
              exit(0)

          review = Path("qa-review.md").read_text(encoding="utf-8")
          recommendation = Path("qa-review-result.txt").read_text(encoding="utf-8").strip()

          payload = {
              "text": (
                  f"<!channel> *${{ inputs.slack_title }}*\n"
                  f"Repository: ${{ github.repository }}\n"
                  f"PR: #${{ github.event.pull_request.number }}\n"
                  f"Final recommendation: {recommendation}\n\n"
                  f"{review[:3200]}"
              )
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY

      - name: Fail workflow on BLOCK
        if: ${{ inputs.fail_on_block }}
        run: |
          RESULT="$(cat qa-review-result.txt)"
          if [ "$RESULT" = "BLOCK" ]; then
            echo "Final recommendation is BLOCK. Failing workflow."
            exit 1
          fi
