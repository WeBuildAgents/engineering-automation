name: PR QA Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qa-review:
    uses: veronicanegreiro-wba/engineering-automation/.github/workflows/reusable-pr-qa-review.yml@main
    secrets: inherit
    with:
      slack_enabled: true
      slack_title: "PR QA Review"
      max_diff_chars: 120000
